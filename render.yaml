services:
  - type: web
    name: kit-api
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:render
    healthCheckPath: /api/health
    disk:
      name: kit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/kit.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: AIRFARE_MCP_URL
        value: https://mcp.kiwi.com
      - key: AIRFARE_MCP_TOOL
        value: search-flight
